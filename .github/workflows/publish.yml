name: Collect and publish Market Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub 定时可能延迟/跳过；提高触发密度，不将计划时刻当成实际采集时间。
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: market-daily-publish
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DATA_DIR: ${{ github.workspace }}/.history/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore persistent daily history
        id: history
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git ls-remote --heads origin refs/heads/history | cut -f1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ]; then
            git fetch --depth=2 origin refs/heads/history
            git worktree add --detach .history FETCH_HEAD
          else
            git worktree add --detach .history HEAD
            git -C .history switch --orphan initial-history
          fi
      - name: Collect titles and market data, then build public site
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository_name,,}" == *.github.io ]]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/$repository_name/"
          fi
          node scripts/publish-static.mjs
      - name: Save history before publishing
        shell: bash
        env:
          EXPECTED_HISTORY: ${{ steps.history.outputs.previous }}
        run: |
          set -euo pipefail
          git -C .history config user.name 'github-actions[bot]'
          git -C .history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .history add -- data
          stamp=$(TZ=Asia/Shanghai date +%F)
          message="Daily archive $stamp"
          if ! git -C .history diff --cached --quiet; then
            # 该分支仅保存程序数据：同日合并为一次提交，跨日保留每日快照。
            if [ -n "$EXPECTED_HISTORY" ] && [ "$(git -C .history log -1 --format=%s)" = "$message" ]; then
              git -C .history commit --amend -m "$message"
            else
              git -C .history commit -m "$message"
            fi
            git -C .history push --force-with-lease="refs/heads/history:$EXPECTED_HISTORY" origin HEAD:refs/heads/history
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
